<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<body>
    <header>
        <nav>
            <div class="logo">CareerOps</div>
            <div class="nav-links">
                <a href="#">Dashboard</a>
                <a href="#">Avaliação</a>
                <a href="#">Stories</a>
            </div>

            <button class="btn-novo" id="btn-novo">+ Nova Vaga</button>
        </nav>
    </header>

    <main>
        <div class="subbar">
            <span class="titulo-pagina">Dashboard</span>

            <div class="filtros">
                <button class="filtro">Todos</button>
                <button class="filtro">Remoto</button>
                <button class="filtro">Sênior</button>
                <button class="filtro">Score A</button>
            </div>
        </div>

            <div class="coluna">
                <div class="col-header">
                    <span class="col-titulo">Avaliando</span>
                    <span class="col-contador">1</span>
                </div>
                <div class="col-cards">
                    <div class="card">
                        <div class="card-topo">
                            <div class="card-vaga">Nome da vaga</div>
                            <div class="card-titulo">Vaga</div>
                            <div class="status">status</div>
                            <div class="card-tags">Tags</div>  <!-- remoto, sênior -->
                            <div class="card-rodape">Rodapé</div> <!-- match % e data -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="coluna">
                <div class="col-header">
                    <span class="col-titulo">Aplicado</span>
                    <span class="col-contador">2</span>
                </div>
                <div class="col-cards">
                    <div class="card">
                        <div class="card-topo">

                            <div class="card-tags">Tags</div>  <!-- remoto, sênior -->
                            <div class="card-rodape">Rodapé</div> <!-- match % e data -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="coluna">
                <div class="col-header">
                    <span class="col-titulo">Entrevista</span>
                    <span class="col-contador">3</span>
                </div>
                <div class="col-cards">
                    <div class="card">
                        <div class="card-topo">
                            <div class="card-vaga">Nome da vaga</div>
                            <div class="card-titulo">Vaga</div>
                            <div class="status">status</div>
                            <div class="card-tags">Tags</div>  <!-- remoto, sênior -->
                            <div class="card-rodape">Rodapé</div> <!-- match % e data -->
                        </div>
                    </div>
                </div>
            </div>

            <div class="coluna">
                <div class="col-header">
                    <span class="col-titulo">Oferta</span>
                    <span class="col-contador">4</span>
                </div>
                <div class="col-cards">
                    <div class="card">
                        <div class="card-topo">
                            <div class="card-vaga">Nome da vaga</div>
                            <div class="card-titulo">Vaga</div>
                            <div class="status">status</div>
                            <div class="card-tags">Tags</div>  <!-- remoto, sênior -->
                            <div class="card-rodape">Rodapé</div> <!-- match % e data -->
                        </div>
                    </div>
                </div>
            </div>


            <div class="coluna">
                <div class="col-header">
                    <span class="col-titulo">Rejeitado</span>
                    <span class="col-contador">5</span>
                </div>
                <div class="col-cards">
                    <div class="card">
                        <div class="card-topo">
                            <div class="card-vaga">Nome da vaga</div>
                            <div class="card-titulo">Vaga</div>
                            <div class="status">status</div>
                            <div class="card-tags">Tags</div>  <!-- remoto, sênior -->
                            <div class="card-rodape">Rodapé</div> <!-- match % e data -->
                        </div>
                    </div>
                </div>
            </div>

    </main>
</body>
</html>
